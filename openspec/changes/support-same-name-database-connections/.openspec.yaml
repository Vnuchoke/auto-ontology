schema: spec-driven
created: 2026-11-07
goal: Поддержать одновременное подключение локальной и продовой БД с одинаковым
  физическим именем и похожими схемами разных версий. Различать источники по
  уникальному идентификатору подключения, независимому от имени БД. Позволить
  пользователю задавать анализируемым БД понятные ярлыки, уникальные среди
  подключений, и отображать их при выборе источника, чтобы различать БД с
  одинаковым физическим именем. Ярлык не заменяет идентификатор подключения
  и физическое имя БД. Изолировать метаданные источников и маршрутизацию
  запросов, исключая выбор другого окружения при совпадении имён.
  Сохранить совместимость существующих
  подключений; межбазовые JOIN не входят в цель.
